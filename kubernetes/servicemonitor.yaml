apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloud-native-devops-monitor
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: cloud-native-devops
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - default
